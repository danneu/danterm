# Purity policy for every first-party Swift module, read by scripts/core-purity-lint.sh.
#
# Only deviations from the floor are listed. The floor is `portable`: a module
# nobody declares is still checked, and must stay free of Cocoa/AppKit/SwiftUI.
# A module is any non-test target a first-party manifest declares, keyed here by
# its root-relative path (`app`, `cli`, `lib/Pkg/Sources/Pkg`, ...).
# That is the point of the file -- the gate used to name its targets by hand, so
# a module nobody remembered was a module nobody checked, and the tree had
# twenty-seven of them. Adding a module now needs no edit here unless its
# contract is stricter or it is real UI.
#
# Format:  <module path>  <profile> [import rule]
#   profile     pure | portable | ui
#   import rule allow=<Module[,Module...]> | forbid-imports   (pure only)
#
# `ui` means the module legitimately draws with a platform toolkit. It is an
# exemption, so it must name why in a comment.

lib/DanTermCore/Sources/DanTermCore                pure
lib/TerminalCore/Sources/TerminalCore              pure allow=BitCollections,DequeModule
lib/TerminalCore/Sources/TerminalRenderPlanning    pure allow=TerminalCore,TerminalSpriteGeometry
lib/TerminalPTY/Sources/PaneProcessLifecycle       pure forbid-imports

# Platform UI. Each of these owns the drawing or the app shell, so the UI ban
# cannot apply to it.
app                                                ui   # AppKit runtime and Command interpreter
lib/TerminalCore/Sources/TerminalRenderExecution   ui   # CoreText/AppKit glyph rasterization
lib/TerminalHostTools/Sources/GlyphPreview         ui   # AppKit glyph inspection tool
ios/DanTermMobileApp/Sources/DanTermMobileApp      ui   # UIKit application shell
examples/MiniTerm/Sources/MiniTerm                 ui   # AppKit window for the engine embedding example
