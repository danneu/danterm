name: Cache GhosttyKit

# Warm the GhosttyKit cache on the default branch so tag-triggered release
# workflows can reuse it (GitHub Actions caches from tags are scoped to that
# tag ref and invisible to other tags).

on:
  push:
    branches: [master]
    paths:
      - '.ghostty-version'
      - 'build-lib.sh'
      - '.github/workflows/cache-ghosttykit.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release-stable.yml'

  # Allow manual trigger to seed the cache
  workflow_dispatch:

jobs:
  cache:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Load Ghostty version
        id: ghostty-version
        run: |
          GHOSTTY_TAG=$(./scripts/load-ghostty-version.sh)
          echo "GHOSTTY_TAG=$GHOSTTY_TAG" >> "$GITHUB_ENV"
          echo "tag=$GHOSTTY_TAG" >> "$GITHUB_OUTPUT"

      - name: Cache GhosttyKit
        id: cache-ghosttykit
        uses: actions/cache@v5
        with:
          path: |
            lib/GhosttyKit.xcframework
            lib/ghostty-themes
          key: ghosttykit-v2-${{ steps.ghostty-version.outputs.tag }}-${{ hashFiles('build-lib.sh') }}-${{ runner.os }}-${{ runner.arch }}

      - uses: mlugg/setup-zig@v2
        if: steps.cache-ghosttykit.outputs.cache-hit != 'true'
        with:
          version: 0.15.2

      - name: Clone Ghostty source
        if: steps.cache-ghosttykit.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$GHOSTTY_TAG" https://github.com/ghostty-org/ghostty.git .ghostty-src

      - name: Build GhosttyKit
        if: steps.cache-ghosttykit.outputs.cache-hit != 'true'
        run: |
          cd .ghostty-src
          zig build \
            -Demit-xcframework \
            -Dxcframework-target=native \
            -Demit-macos-app=false \
            -Dsentry=false \
            -Doptimize=ReleaseFast
          cd ..
          mkdir -p lib
          cp -R .ghostty-src/macos/GhosttyKit.xcframework lib/
          cp -R .ghostty-src/zig-out/share/ghostty/themes lib/ghostty-themes
