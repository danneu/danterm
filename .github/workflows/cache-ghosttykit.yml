name: Cache GhosttyKit

# Warm the GhosttyKit cache on the default branch so tag-triggered release
# workflows can reuse it (GitHub Actions caches from tags are scoped to that
# tag ref and invisible to other tags).

on:
  push:
    branches: [master]
    paths:
      - '.ghostty-version'
      - 'build-lib.sh'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/cache-ghosttykit.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release-stable.yml'

  # Allow manual trigger to seed the cache
  workflow_dispatch:

jobs:
  cache:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Load Ghostty version
        id: ghostty-version
        run: |
          GHOSTTY_TAG=$(./scripts/load-ghostty-version.sh)
          echo "GHOSTTY_TAG=$GHOSTTY_TAG" >> "$GITHUB_ENV"
          echo "tag=$GHOSTTY_TAG" >> "$GITHUB_OUTPUT"

      - name: Cache GhosttyKit
        id: cache-ghosttykit
        uses: actions/cache@v5
        with:
          path: |
            lib/GhosttyKit.xcframework
            lib/ghostty-themes
          key: ghosttykit-v2-${{ steps.ghostty-version.outputs.tag }}-${{ hashFiles('build-lib.sh', 'flake.nix', 'flake.lock') }}-${{ runner.os }}-${{ runner.arch }}

      - uses: DeterminateSystems/nix-installer-action@v22
        if: steps.cache-ghosttykit.outputs.cache-hit != 'true'

      - name: Build GhosttyKit
        if: steps.cache-ghosttykit.outputs.cache-hit != 'true'
        run: ./build-lib.sh all
