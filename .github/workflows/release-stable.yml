name: Release (Stable)

on:
  push:
    tags:
      - 'v*'

env:
  APP_NAME: DanTerm
  BUNDLE_ID: com.danneu.danterm
  EXECUTABLE: DanTerm
  GHOSTTY_TAG: v1.2.3

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "DMG_NAME=DanTerm-${VERSION}.dmg" >> "$GITHUB_ENV"
          echo "ZIP_NAME=DanTerm-${VERSION}.zip" >> "$GITHUB_ENV"

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Clone Ghostty source
        run: |
          git clone --depth 1 --branch ${{ env.GHOSTTY_TAG }} https://github.com/ghostty-org/ghostty.git .ghostty-src
          # Patch stale iTerm2-Color-Schemes URL (removed upstream between Ghostty releases)
          sed -i '' \
            's|release-20251002-142451-4a5043e|release-20260216-151611-fc73ce3|' \
            .ghostty-src/build.zig.zon
          sed -i '' \
            's|N-V-__8AALIsAwDyo88G5mGJGN2lSVmmFMx4YePfUvp_2o3Y|N-V-__8AABVbAwBwDRyZONfx553tvMW8_A2OKUoLzPUSRiLF|' \
            .ghostty-src/build.zig.zon

      - name: Cache GhosttyKit
        id: cache-ghosttykit
        uses: actions/cache@v4
        with:
          path: lib/GhosttyKit.xcframework
          key: ghosttykit-${{ env.GHOSTTY_TAG }}-${{ hashFiles('build-lib.sh') }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build GhosttyKit
        if: steps.cache-ghosttykit.outputs.cache-hit != 'true'
        run: |
          cd .ghostty-src
          zig build \
            -Demit-xcframework \
            -Dxcframework-target=native \
            -Demit-macos-app=false \
            -Dsentry=false \
            -Doptimize=ReleaseFast
          cd ..
          mkdir -p lib
          cp -R .ghostty-src/macos/GhosttyKit.xcframework lib/

      - name: Build Swift app
        run: |
          # Find the macOS slice (name varies: macos-arm64_x86_64, macos-arm64, etc.)
          MACOS_DIR=$(find lib/GhosttyKit.xcframework -maxdepth 1 -type d -name 'macos-*' | head -1)
          if [ -z "$MACOS_DIR" ]; then
            echo "Error: no macOS slice found in xcframework"
            exit 1
          fi

          SWIFT_FILES=()
          while IFS= read -r line; do
            [[ -z "$line" || "$line" == \#* ]] && continue
            SWIFT_FILES+=("$line")
          done < swift-sources.txt

          APP_PATH="build/${{ env.APP_NAME }}.app"
          mkdir -p "$APP_PATH/Contents/MacOS"

          xcrun swiftc -O \
            -o "$APP_PATH/Contents/MacOS/${{ env.EXECUTABLE }}" \
            "${SWIFT_FILES[@]}" \
            -I "$MACOS_DIR/Headers" \
            -Xcc -fmodule-map-file="$MACOS_DIR/Headers/module.modulemap" \
            "$MACOS_DIR"/libghostty*.a \
            -framework Cocoa \
            -framework Metal \
            -framework MetalKit \
            -framework QuartzCore \
            -framework CoreText \
            -framework IOKit \
            -framework IOSurface \
            -framework Carbon \
            -framework UniformTypeIdentifiers \
            -lc++

          cp app/Info.plist "$APP_PATH/Contents/"
          plutil -replace CFBundleVersion -string "${{ env.VERSION }}" "$APP_PATH/Contents/Info.plist"
          plutil -replace CFBundleShortVersionString -string "${{ env.VERSION }}" "$APP_PATH/Contents/Info.plist"

      - name: Import signing certificate
        env:
          DEVELOPER_ID_APPLICATION_CERT_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_P12 }}
          DEVELOPER_ID_APPLICATION_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$DEVELOPER_ID_APPLICATION_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" \
            -P "$DEVELOPER_ID_APPLICATION_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')

          # Extract signing identity
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Codesign app
        run: |
          APP_PATH="build/${{ env.APP_NAME }}.app"
          codesign --force --deep --options runtime \
            --sign "${{ env.SIGNING_IDENTITY }}" "$APP_PATH"

      - name: Create DMG
        run: |
          DMG_TMP="$RUNNER_TEMP/dmg-staging"
          mkdir -p "$DMG_TMP"
          cp -R "build/${{ env.APP_NAME }}.app" "$DMG_TMP/"
          ln -s /Applications "$DMG_TMP/Applications"
          hdiutil create -volname "${{ env.APP_NAME }}" -srcfolder "$DMG_TMP" \
            -ov -format UDZO "build/${{ env.DMG_NAME }}"

      - name: Create ZIP
        run: |
          cd build
          zip -r "${{ env.ZIP_NAME }}" "${{ env.APP_NAME }}.app"

      - name: Notarize DMG
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          echo "$APPLE_API_KEY_P8" > ~/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8

          xcrun notarytool submit "build/${{ env.DMG_NAME }}" \
            --key ~/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8 \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait

          xcrun stapler staple "build/${{ env.DMG_NAME }}"

      - name: Notarize ZIP
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          xcrun notarytool submit "build/${{ env.ZIP_NAME }}" \
            --key ~/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8 \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            build/${{ env.DMG_NAME }}
            build/${{ env.ZIP_NAME }}
