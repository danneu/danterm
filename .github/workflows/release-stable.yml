name: Release (Stable)

on:
  push:
    tags:
      - 'v*'

env:
  APP_NAME: DanTerm
  BUNDLE_ID: com.danneu.danterm
  EXECUTABLE: DanTerm
  GHOSTTY_TAG: v1.3.0

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@v22

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "DMG_NAME=DanTerm-${VERSION}.dmg" >> "$GITHUB_ENV"
          echo "ZIP_NAME=DanTerm-${VERSION}.zip" >> "$GITHUB_ENV"

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Clone Ghostty source
        run: |
          git clone --depth 1 --branch ${{ env.GHOSTTY_TAG }} https://github.com/ghostty-org/ghostty.git .ghostty-src

      - name: Cache GhosttyKit
        id: cache-ghosttykit
        uses: actions/cache@v5
        with:
          path: |
            lib/GhosttyKit.xcframework
            lib/ghostty-themes
          key: ghosttykit-v2-${{ env.GHOSTTY_TAG }}-${{ hashFiles('build-lib.sh') }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build GhosttyKit
        if: steps.cache-ghosttykit.outputs.cache-hit != 'true'
        run: |
          cd .ghostty-src
          zig build \
            -Demit-xcframework \
            -Dxcframework-target=native \
            -Demit-macos-app=false \
            -Dsentry=false \
            -Doptimize=ReleaseFast
          cd ..
          mkdir -p lib
          cp -R .ghostty-src/macos/GhosttyKit.xcframework lib/
          cp -R .ghostty-src/zig-out/share/ghostty/themes lib/ghostty-themes

      - name: Build app bundle
        run: ./build-app.sh --version "${{ env.VERSION }}"

      - name: Import signing certificate
        env:
          DEVELOPER_ID_APPLICATION_CERT_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_P12 }}
          DEVELOPER_ID_APPLICATION_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$DEVELOPER_ID_APPLICATION_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" \
            -P "$DEVELOPER_ID_APPLICATION_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')

          # Extract signing identity
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Codesign app
        run: |
          APP_PATH="build/${{ env.APP_NAME }}.app"
          codesign --force --options runtime \
            --sign "${{ env.SIGNING_IDENTITY }}" "$APP_PATH/Contents/MacOS/danterm"
          codesign --force --deep --options runtime \
            --sign "${{ env.SIGNING_IDENTITY }}" "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Create DMG
        run: |
          DMG_TMP="$RUNNER_TEMP/dmg-staging"
          mkdir -p "$DMG_TMP"
          cp -R "build/${{ env.APP_NAME }}.app" "$DMG_TMP/"
          ln -s /Applications "$DMG_TMP/Applications"
          hdiutil create -volname "${{ env.APP_NAME }}" -srcfolder "$DMG_TMP" \
            -ov -format UDZO "build/${{ env.DMG_NAME }}"

      - name: Create ZIP
        run: |
          cd build
          zip -r "${{ env.ZIP_NAME }}" "${{ env.APP_NAME }}.app"

      - name: Notarize DMG
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          echo "$APPLE_API_KEY_P8" > ~/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8

          xcrun notarytool submit "build/${{ env.DMG_NAME }}" \
            --key ~/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8 \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait

          xcrun stapler staple "build/${{ env.DMG_NAME }}"

      - name: Notarize ZIP
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          xcrun notarytool submit "build/${{ env.ZIP_NAME }}" \
            --key ~/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8 \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          if gh release view "$tag" &>/dev/null; then
            gh release upload "$tag" \
              build/${{ env.DMG_NAME }} \
              build/${{ env.ZIP_NAME }} \
              --clobber
          else
            NOTES_FILE="$RUNNER_TEMP/release-notes.md"
            nix run nixpkgs#git-cliff -- \
              --current \
              --strip all \
              --output "$NOTES_FILE"
            if [ ! -s "$NOTES_FILE" ]; then
              printf '_No notable changes._\n' > "$NOTES_FILE"
            fi
            gh release create "$tag" \
              --title "$tag" \
              --notes-file "$NOTES_FILE" \
              build/${{ env.DMG_NAME }} \
              build/${{ env.ZIP_NAME }}
          fi

      - name: Compute release zip hash
        run: |
          SRI=$(nix hash convert --hash-algo sha256 --to sri $(nix-prefetch-url --unpack --type sha256 "file://$PWD/build/${{ env.ZIP_NAME }}" 2>/dev/null))
          echo "ZIP_SRI=$SRI" >> "$GITHUB_ENV"

      # Check out master to a separate path so the second checkout doesn't
      # clobber the default workdir (which holds lib/GhosttyKit.xcframework
      # and .zig-cache). actions/cache saves in post-job cleanup, so those
      # paths must still exist when the job finishes.
      - name: Checkout master for package.nix update
        uses: actions/checkout@v6
        with:
          ref: master
          path: master-checkout

      - name: Update package.nix with release hash
        working-directory: master-checkout
        run: |
          sed -i '' "s|version = \".*\"|version = \"$VERSION\"|" package.nix
          sed -i '' "s|sha256 = \".*\"|sha256 = \"$ZIP_SRI\"|" package.nix

      - name: Create PR with updated package.nix
        id: package_pr
        uses: peter-evans/create-pull-request@v8
        with:
          path: master-checkout
          base: master
          branch: nix/v${{ env.VERSION }}
          commit-message: "nix: update package.nix to v${{ env.VERSION }}"
          title: "nix: update package.nix to v${{ env.VERSION }}"
          body: "Auto-generated after release v${{ env.VERSION }}."
          delete-branch: true

      - name: Enable auto-merge for package update PR
        if: ${{ steps.package_pr.outputs.pull-request-number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        # Try immediate merge first (all conditions are trivially met: no
        # required checks, 0 required reviews). Fall back to auto-merge if
        # checks are still pending.
        run: |
          gh pr merge --squash "${{ steps.package_pr.outputs.pull-request-number }}" \
            || gh pr merge --auto --squash "${{ steps.package_pr.outputs.pull-request-number }}"
