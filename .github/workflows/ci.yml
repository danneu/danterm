name: CI

on:
  pull_request:

env:
  GHOSTTY_TAG: v1.3.0

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Clone Ghostty source
        run: |
          git clone --depth 1 --branch ${{ env.GHOSTTY_TAG }} https://github.com/ghostty-org/ghostty.git .ghostty-src

      - name: Cache GhosttyKit
        id: cache-ghosttykit
        uses: actions/cache@v5
        with:
          path: |
            lib/GhosttyKit.xcframework
            lib/ghostty-themes
          key: ghosttykit-v2-${{ env.GHOSTTY_TAG }}-${{ hashFiles('build-lib.sh') }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build GhosttyKit
        if: steps.cache-ghosttykit.outputs.cache-hit != 'true'
        run: |
          cd .ghostty-src
          zig build \
            -Demit-xcframework \
            -Dxcframework-target=native \
            -Demit-macos-app=false \
            -Dsentry=false \
            -Doptimize=ReleaseFast
          cd ..
          mkdir -p lib
          cp -R .ghostty-src/macos/GhosttyKit.xcframework lib/
          cp -R .ghostty-src/zig-out/share/ghostty/themes lib/ghostty-themes

      - name: Build app bundle
        run: ./build-app.sh

      - name: Codesign (ad-hoc)
        run: codesign --force --deep --sign - build/DanTerm.app

  release-build-check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Clone Ghostty source
        run: |
          git clone --depth 1 --branch ${{ env.GHOSTTY_TAG }} https://github.com/ghostty-org/ghostty.git .ghostty-src

      - name: Cache GhosttyKit
        id: cache-ghosttykit
        uses: actions/cache@v5
        with:
          path: |
            lib/GhosttyKit.xcframework
            lib/ghostty-themes
          key: ghosttykit-v2-${{ env.GHOSTTY_TAG }}-${{ hashFiles('build-lib.sh') }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build GhosttyKit
        if: steps.cache-ghosttykit.outputs.cache-hit != 'true'
        run: |
          cd .ghostty-src
          zig build \
            -Demit-xcframework \
            -Dxcframework-target=native \
            -Demit-macos-app=false \
            -Dsentry=false \
            -Doptimize=ReleaseFast
          cd ..
          mkdir -p lib
          cp -R .ghostty-src/macos/GhosttyKit.xcframework lib/
          cp -R .ghostty-src/zig-out/share/ghostty/themes lib/ghostty-themes

      - name: Build app bundle (release validation)
        run: ./build-app.sh --version "0.0.0-test"

      - name: Verify release bundle
        run: |
          APP_PATH="build/DanTerm.app"
          test -f "$APP_PATH/Contents/MacOS/DanTerm"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PATH/Contents/Info.plist")
          [ "$VERSION" = "0.0.0-test" ] || { echo "Version mismatch: $VERSION"; exit 1; }
          codesign --force --deep --sign - "$APP_PATH"
          codesign -v "$APP_PATH"
          echo "Release build validation passed"
