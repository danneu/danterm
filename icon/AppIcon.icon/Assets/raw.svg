<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<!-- A monoline "$d". Both letters are stroked paths, so nothing here depends on
     a font being installed when the icon is built.

     The "$" is one antisymmetric spine: over the top, diagonal through the
     middle, under the bottom. Turning it 180 degrees maps it onto itself.
     Its bar is two stubs whose inner ends stop on the spine's own centreline.
     The spine is drawn last at the same stroke width and covers those ends,
     which is why the bar shows only above and below the S.

     The two letters are the same height on purpose: both span y=302 to
     y=722, so the "d" ascender rises exactly as far as the "$" bar.
     Shared metrics: stroke 60, d bowl 270 across, gap 60. -->
  <g fill="none" stroke-linecap="round">

    <!-- "$" in systemGreen: two bar stubs, then the S drawn over them -->
    <g stroke="#34C759" stroke-width="60">
      <path d="M347 331.9 L347 371.9"/>
      <path d="M347 652.1 L347 692.1"/>
      <path d="M417 411 C417 357.3 277 357.3 277 421.1 C277 481.1 417 542.9 417 602.9 C417 666.7 277 666.7 277 613"/>
    </g>

    <!-- "d" in orange: circular bowl tangent to a straight stem -->
    <g stroke="#FF6600" stroke-width="60">
      <circle cx="642" cy="587" r="105"/>
      <path d="M747 332 L747 692"/>
    </g>
  </g>
</svg>
