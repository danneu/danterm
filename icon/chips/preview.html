<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>DanTerm pane-kind chips</title>
<!--
  Live preview for the pane-kind chips. Reads chips.json and the .svg files in
  this directory -- the same inputs the generator reads -- so tuning a value in
  chips.json and reloading shows what will actually ship. Nothing here is
  authoritative; it renders, it does not define.

  Needs a local server, because fetch() of a sibling file is blocked on file://:
      python3 -m http.server -d icon/chips 8000
      open http://localhost:8000/preview.html
-->
<style>
*{box-sizing:border-box}
body{margin:0;font:13px -apple-system,BlinkMacSystemFont,sans-serif;background:#e8e8ea;color:#111}
.wrap{max-width:1180px;margin:0 auto;padding:24px 28px 80px}
h1{font-size:15px;margin:0 0 4px}
.sub{font-size:12px;opacity:.55;margin:0 0 20px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.5;margin:26px 0 10px;font-weight:600}
h3{font-size:11px;opacity:.45;margin:15px 0 6px;font-weight:600}
.err{background:#ffe2e2;border:1px solid #e5a0a0;border-radius:8px;padding:14px 16px;font-size:12.5px;line-height:1.5}
.err code{background:rgba(0,0,0,.07);padding:1px 5px;border-radius:3px}
.panes{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.pane{border-radius:10px;padding:14px 18px 20px;border:1px solid rgba(0,0,0,.12)}
.pane.light{background:#f2f2f4;color:#111}
.pane.dark{background:#1e1e20;color:#eee;border-color:rgba(255,255,255,.14)}
.pane.dark h2,.pane.dark h3{opacity:.55}
.row{display:flex;align-items:center;gap:10px;margin:9px 0}
.lbl{font-size:11px;opacity:.5;width:104px;flex:none}
.note{font-size:11px;opacity:.45;margin-left:8px}

.sidebar{border-radius:8px;overflow:hidden;width:262px;border:1px solid rgba(0,0,0,.1)}
.dark .sidebar{border-color:rgba(255,255,255,.1);background:#232326}
.light .sidebar{background:#fafafa}
.tab{height:40px;display:flex;align-items:center;gap:8px;padding-right:10px}
.tab.sel{background:rgba(0,122,255,.16)}
.stripe{width:5px;height:100%;flex:none}
.tabtext{display:flex;flex-direction:column;gap:1px;min-width:0}
.t1{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:10.5px;opacity:.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panerow{display:flex;gap:3px;margin-top:2px}
.note2{font-size:11px;opacity:.5;line-height:1.5;margin:0 0 12px;max-width:44em}
.trow{display:flex;align-items:center;gap:10px;margin:0 0 8px}
.sub2{opacity:.7;font-size:10px}
.striprow{height:40px;width:206px;flex:none;display:flex;align-items:center;gap:8px;
          padding-right:10px;border-radius:6px;overflow:hidden}
.light .striprow{background:#fafafa}
.dark .striprow{background:#232326}
.striprow.sel{color:#fff}
.light .striprow.sel,.dark .striprow.sel{background:#007aff}
.dark .striprow.sel{background:#0a84ff}

.toolbar{height:22px;display:flex;align-items:center;gap:6px;padding:0 8px;border-radius:5px;font-size:11px;width:420px;margin-bottom:6px}
.light .toolbar{background:rgba(0,0,0,.055);color:#333}
.dark .toolbar{background:rgba(255,255,255,.08);color:#ddd}
.toolbar .cmd{opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.chip{flex:none;display:inline-flex;align-items:center;justify-content:center}
.chip svg{display:block;overflow:visible}
</style>
</head>
<body>
<div class="wrap">
  <h1>Pane-kind chips</h1>
  <p class="sub">Rendered from <code>chips.json</code> + the sibling <code>.svg</code> files. Edit either and reload.</p>
  <div id="out"></div>
</div>

<script>
// Filled from the manifest at boot, in its declaration order, so adding a kind
// to chips.json is enough to preview it.
let KINDS = [];

// `panes` stands in for a multi-pane tab: that row spends its second line
// enumerating its panes instead of showing a cwd, and every chip but the
// focused one is grey.
const TABS = [
  {kind: "terminal", stripe: "#5b8def", t1: "danterm",         t2: "~/Code/danterm"},
  {kind: "claude",   stripe: "#e0a44b", t1: "engine refactor", t2: "claude · lib/TerminalCore",
   panes: ["terminal", "claude", "codex"], focused: 1},
  {kind: "codex",    stripe: "#57b86b", t1: "review",          t2: "codex · ~/Code/danterm"},
  {kind: "agent",    stripe: "#8b7ad6", t1: "prompt tuning",   t2: "aider · lib/TerminalPTY",
   panes: ["agent", "terminal"], focused: 0},
  {kind: "terminal", stripe: "#c96ab8", t1: "btop",            t2: "~"}
];

// --- loading -------------------------------------------------------------

async function loadArt(file) {
  const text = await (await fetch(file)).text();
  const doc = new DOMParser().parseFromString(text, "image/svg+xml");
  const svg = doc.querySelector("svg");
  const vb = svg.getAttribute("viewBox").trim().split(/[\s,]+/).map(Number);
  const paths = [...doc.querySelectorAll("path")].map(p => ({
    d: p.getAttribute("d"),
    rule: p.getAttribute("fill-rule") || "nonzero",
    stroked: (p.getAttribute("fill") || "") === "none",
    sw: Number(p.getAttribute("stroke-width") || 0),
    cap: p.getAttribute("stroke-linecap") || "butt",
    join: p.getAttribute("stroke-linejoin") || "miter"
  }));
  return {viewBox: vb, w: vb[2], h: vb[3], ratio: vb[2] / vb[3], paths};
}

// --- drawing -------------------------------------------------------------

// `dilate` is expressed on a 24-unit box for every mark, so scale it into this
// mark's own viewBox units before using it as a stroke width.
function glyph(art, box, fill, color, dilate) {
  let w, h;
  if (art.ratio >= 1) { w = box * fill; h = w / art.ratio; }
  else                { h = box * fill; w = h * art.ratio; }
  const d = (dilate || 0) * (art.w / 24);

  const body = art.paths.map(p => p.stroked
    ? `<path d="${p.d}" fill="none" stroke="${color}" stroke-width="${p.sw}"
             stroke-linecap="${p.cap}" stroke-linejoin="${p.join}"/>`
    : `<path d="${p.d}" fill="${color}" fill-rule="${p.rule}"` +
      (d ? ` stroke="${color}" stroke-width="${d}" stroke-linejoin="round"` : "") + `/>`
  ).join("");

  return `<svg width="${w.toFixed(2)}" height="${h.toFixed(2)}"
               viewBox="${art.viewBox.join(" ")}">${body}</svg>`;
}

// Mirrors ChipRenderer.grey: CoreGraphics converts the sRGB color into the
// generic gray gamma-2.2 space, which is linearize -> D65 luminance -> re-encode
// at 2.2. CSS `filter: grayscale(1)` weights the *encoded* channels instead and
// comes out visibly lighter, so the math is spelled out rather than borrowed.
// Alpha is untouched, so a translucent wash stays translucent.
function desaturate(hex) {
  const m = /^#([0-9a-f]{6})([0-9a-f]{2})?$/i.exec(hex.trim());
  if (!m) return hex;
  const n = parseInt(m[1], 16);
  const lin = v => (v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));
  const Y = 0.2126 * lin(((n >> 16) & 255) / 255)
          + 0.7152 * lin(((n >> 8) & 255) / 255)
          + 0.0722 * lin((n & 255) / 255);
  const g = Math.round(Math.pow(Y, 1 / 2.2) * 255).toString(16).padStart(2, "0");
  return `#${g}${g}${g}${m[2] || ""}`;
}

// --- pane list -----------------------------------------------------------
//
// The strip a multi-pane tab shows on its second line. Every chip drops its own
// brand colors for one shared monochrome pair, so the strip reads as "which
// pane", not "what is each pane"; the treatment decides how the active one is
// lifted out. `surfaceBg` is the row the strip sits on, which a treatment needs
// whenever it inverts (its mark has to be punched in the row's own color).
const PANE_TREATMENTS = [
  ["grey",        "brand, desaturated",  (P, S, bg, on) => on
                                            ? {brand: true}
                                            : {brand: true, grey: true}],
  ["accent-fill", "accent fills the chip", (P, S, bg, on) => on
                                            ? {bg: P.accent, fg: P.onAccent}
                                            : {bg: S.bg, fg: S.dim}],
  ["accent-mark", "accent marks it",      (P, S, bg, on) => on
                                            ? {bg: S.bg, fg: P.accent}
                                            : {bg: S.bg, fg: S.dim}],
  ["accent-ring", "accent rings it",      (P, S, bg, on) => on
                                            ? {bg: S.bg, fg: S.fg, ring: P.accent}
                                            : {bg: S.bg, fg: S.dim}],
  ["bare",        "no chip, ink only",    (P, S, bg, on) => on
                                            ? {bg: "transparent", fg: P.accent}
                                            : {bg: "transparent", fg: S.dim}],
  ["contrast",    "contrast only, no hue", (P, S, bg, on) => on
                                            ? {bg: opaque(S.fg), fg: bg}
                                            : {bg: S.bg, fg: S.dim}],
  // The same idea with the surface taken out of it. Sidebar selection is
  // NSOutlineView-owned and changes without reloading the cell, so a chip whose
  // colors depend on whether its row is selected would need a signal the cell
  // does not get. These are fixed per appearance instead, and clear the accent
  // by luminance rather than by hue -- the accent is mid-bright, so near-black
  // reads on it in light and near-white reads on it in dark.
  ["fixed",       "contrast, surface-independent", (P, S, bg, on) => on
                                            ? {bg: P.fixed.onBg, fg: P.fixed.onFg}
                                            : {bg: P.fixed.bg, fg: P.fixed.fg}]
];

// The treatment that ships, so the sidebar mock below predicts the real row
// instead of showing a candidate that lost.
const SHIPPED = PANE_TREATMENTS.find(t => t[0] === "fixed")[2];

// An 8-digit color with its alpha taken to full. The strong neutral is declared
// translucent so it sits on any surface; a treatment that fills with it needs
// the solid version, or the mark punched out of it shows the row through.
function opaque(hex) {
  const m = /^#([0-9a-f]{6})/i.exec(hex.trim());
  return m ? `#${m[1]}FF` : hex;
}

function paneChip(M, art, kind, size, mode, treat, surface, surfaceBg, active) {
  const P = M.paneList[mode];
  const S = P[surface];
  const style = treat(P, S, surfaceBg, active);
  const k = M.kinds[kind];

  let bg, fg;
  if (style.brand) {
    bg = k[mode].bg;
    fg = k[mode].fg;
    if (style.grey) { bg = desaturate(bg); fg = desaturate(fg); }
  } else {
    bg = style.bg;
    fg = style.fg;
  }

  const r = (size * M.cornerRadius).toFixed(2);
  const ring = style.ring ? `box-shadow:0 0 0 1.5px ${style.ring};` : "";
  return `<span class="chip" style="width:${size}px;height:${size}px;` +
         `background:${bg};border-radius:${r}px;${ring}">` +
         glyph(art[kind], size, k.fill, fg, k.dilate) + `</span>`;
}

function chip(M, art, kind, size, mode, opts) {
  opts = opts || {};
  const k = M.kinds[kind];
  const treat = opts.treatment || M.treatment;
  const dilate = opts.dilate === undefined ? k.dilate : opts.dilate;
  const c = k[mode];

  let bg, fg;
  if (treat === "filled") { bg = c.bg; fg = c.fg; }
  else {
    // Exploratory only. The manifest declares one treatment; tinted and bare
    // exist so a change to it can be judged by eye before it is written down.
    // exploreMark is 6-digit so the tint can append its alpha.
    fg = k.exploreMark[mode];
    bg = treat === "tinted" ? fg + "26" : "transparent";
  }

  if (opts.desaturated) { bg = desaturate(bg); fg = desaturate(fg); }

  const r = (size * M.cornerRadius).toFixed(2);
  return `<span class="chip" style="width:${size}px;height:${size}px;` +
         `background:${bg};border-radius:${r}px">` +
         glyph(art[kind], size, k.fill, fg, dilate) + `</span>`;
}

// --- sections ------------------------------------------------------------

// One mock sidebar row carrying a pane strip, so a treatment is judged where it
// will live rather than on a swatch board.
const STRIP = ["terminal", "claude", "codex", "agent"];
const ACTIVE = 1;

function paneStrip(M, art, mode, treat, surface, surfaceBg, selected) {
  const chips = STRIP.map((k, i) =>
    paneChip(M, art, k, M.sizes.paneRow, mode, treat, surface, surfaceBg, i === ACTIVE)
  ).join("");
  return `<div class="striprow${selected ? " sel" : ""}">` +
         `<span class="stripe" style="background:#e0a44b"></span>` +
         chip(M, art, STRIP[ACTIVE], M.sizes.sidebar, mode) +
         `<span class="tabtext"><span class="t1">engine refactor</span>` +
         `<span class="panerow">${chips}</span></span></div>`;
}

function build(M, art, mode) {
  let h = "";
  const C = (kind, size, opts) => chip(M, art, kind, size, mode, opts);

  h += `<h2>current &mdash; treatment: ${M.treatment}</h2>`;
  for (const size of [M.sizes.toolbar, M.sizes.sidebar, 17]) {
    h += `<div class="row"><span class="lbl">${size}pt</span>` +
         KINDS.map(k => C(k, size)).join("") + `</div>`;
  }

  h += `<h2>pane list &mdash; picking a treatment</h2>`;
  h += `<p class="note2">Four panes, the second one focused. Each treatment is
        shown on a plain row and on the selected row, because the selected row
        is the one whose panes you are actually looking at &mdash; and it has
        already spent the accent color on itself.</p>`;
  const rowBg = mode === "light" ? "#fafafa" : "#232326";
  const selBg = M.paneList[mode].accent;
  for (const [id, label, treat] of PANE_TREATMENTS) {
    h += `<div class="trow"><span class="lbl">${id}<br>` +
         `<span class="sub2">${label}</span></span>` +
         paneStrip(M, art, mode, treat, "rest", rowBg, false) +
         paneStrip(M, art, mode, treat, "sel", selBg, true) + `</div>`;
  }

  h += `<h3>sidebar &mdash; ${M.sizes.sidebar}pt chip, 40pt row</h3><div class="sidebar">`;
  TABS.forEach((t, i) => {
    h += `<div class="tab${i === 1 ? " sel" : ""}">` +
         `<span class="stripe" style="background:${t.stripe}"></span>` +
         C(t.kind, M.sizes.sidebar) +
         `<span class="tabtext"><span class="t1">${t.t1}</span>` +
         (t.panes
           ? `<span class="panerow">` + t.panes.map((k, j) =>
               paneChip(M, art, k, M.sizes.paneRow, mode, SHIPPED, "rest",
                        mode === "light" ? "#fafafa" : "#232326",
                        j === t.focused)).join("") + `</span>`
           : `<span class="t2">${t.t2}</span>`) +
         `</span></div>`;
  });
  h += `</div>`;

  h += `<h3>pane toolbar &mdash; ${M.sizes.toolbar}pt chip, 22pt bar</h3>`;
  const bars = [
    ["claude",   "claude · ~/Code/danterm · editing Terminal.swift"],
    ["codex",    "codex · ~/Code/danterm"],
    ["terminal", "btop · ~"]
  ];
  for (const [k, text] of bars) {
    h += `<div class="toolbar">` + C(k, M.sizes.toolbar) +
         `<span class="cmd">${text}</span></div>`;
  }

  h += `<h2>treatments</h2>`;
  for (const treatment of ["filled", "tinted", "bare"]) {
    h += `<div class="row"><span class="lbl">${treatment}</span>` +
         KINDS.map(k => C(k, M.sizes.sidebar, {treatment})).join("") + `</div>`;
  }

  h += `<h2>dilation &mdash; claude vs. the knot</h2>`;
  for (const treatment of ["filled", "tinted", "bare"]) {
    h += `<div class="row"><span class="lbl">${treatment}</span>` +
         [0, .3, .5, .7, .9].map(d =>
           C("claude", M.sizes.sidebar, {treatment, dilate: d})).join("") +
         `<span style="width:12px"></span>` +
         C("codex", M.sizes.sidebar, {treatment}) +
         `<span class="note">0 / .3 / .5 / .7 / .9 &nbsp;|&nbsp; knot</span></div>`;
  }
  return h;
}

// --- boot ----------------------------------------------------------------

(async () => {
  const out = document.getElementById("out");
  let M, art = {};
  try {
    M = await (await fetch("chips.json")).json();
    KINDS = Object.keys(M.kinds);
    for (const k of KINDS) art[k] = await loadArt(M.kinds[k].svg);
  } catch (e) {
    out.innerHTML = `<div class="err"><b>Could not read the source files.</b><br>` +
      `Browsers block <code>fetch()</code> of sibling files over <code>file://</code>. ` +
      `Serve the directory instead:<br><br>` +
      `<code>python3 -m http.server -d icon/chips 8000</code><br>` +
      `<code>open http://localhost:8000/preview.html</code><br><br>` +
      `<i>${e}</i></div>`;
    return;
  }
  out.innerHTML = `<div class="panes">` +
    `<div class="pane light">${build(M, art, "light")}</div>` +
    `<div class="pane dark">${build(M, art, "dark")}</div></div>`;
})();
</script>
</body>
</html>
